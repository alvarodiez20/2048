<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#edc22e"/>
      <stop offset="100%" style="stop-color:#edac1e"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Rounded tile background -->
  <rect x="4" y="4" width="120" height="120" rx="20" ry="20" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- Inner highlight -->
  <rect x="8" y="8" width="112" height="112" rx="16" ry="16" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Text "2048" -->
  <text x="64" y="72" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="42" fill="#f9f6f2" text-anchor="middle" dominant-baseline="central">2048</text>
</svg>
